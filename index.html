<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミライモン 登録テスト</title><style>
:root{font-family:system-ui,sans-serif;color:#243043;background:#f3f7fc}body{max-width:560px;margin:28px auto;padding:16px}main{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 32px #24304315}h1{font-size:1.45rem}p{line-height:1.7}input,button{font:inherit;padding:12px;border-radius:9px}input{border:1px solid #aeb9c7;width:100%;box-sizing:border-box;margin:6px 0 12px}button{background:#215db4;color:white;border:0;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:default}.card{display:block;width:100%;text-align:left;background:#e8f1ff;color:#193b70;padding:16px;margin:8px 0}.muted{color:#596878;font-size:.9rem}.error{color:#a01829}.ok{color:#176437}section{margin-top:22px;border-top:1px solid #e0e6ee;padding-top:16px}</style></head><body><main>
<h1>ミライモン 登録テスト</h1><p class="muted">全員が同じURLを使います。このブラウザには最大3人を登録できます。仮名でお試しください。</p>
<div id="status" role="status">接続設定を待っています。</div>
<section id="setup"><h2>初回の接続設定</h2><label>Project URL<input id="url" placeholder="https://xxxxx.supabase.co" autocomplete="off"></label><label>Publishable key<input id="key" placeholder="sb_publishable_..." autocomplete="off"></label><button id="connect">接続する</button><p class="muted">設定はこのブラウザ内に保存されます。secret key は入力しないでください。</p></section>
<section id="app" hidden><h2>登録した人 <span id="count"></span></h2><div id="list"></div><form id="form"><label>テスト用の名前<input id="name" maxlength="20" required placeholder="例：はる"></label><button id="add" type="submit">新しく登録</button></form><p id="limit" class="muted"></p><div id="selected"></div><button id="reset" type="button">接続設定を入れ直す</button></section>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id), status=(s,error=false)=>{$('status').textContent=s;$('status').className=error?'error':'ok'};
let client;
async function init(){const url=localStorage.getItem('mirai-test-url'),key=localStorage.getItem('mirai-test-key');if(!url||!key)return;$('url').value=url;$('key').value=key;
try{client=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});let {data:{session},error}=await client.auth.getSession();if(error)throw error;
if(!session){const result=await client.auth.signInAnonymously();if(result.error)throw result.error;}
$('setup').hidden=true;$('app').hidden=false;await refresh();}catch(e){status('接続できません: '+e.message,true);$('setup').hidden=false;$('app').hidden=true}}
async function refresh(){const {data,error}=await client.from('test_profiles').select('id,display_name,created_at').order('created_at');if(error){status('データ取得に失敗: '+error.message,true);return}status('接続中。登録済みの人だけを表示しています。');$('count').textContent=`${data.length}/3`;$('list').replaceChildren();for(const item of data){const btn=document.createElement('button');btn.className='card';btn.textContent=item.display_name;btn.onclick=()=>{$('selected').textContent=`${item.display_name} のマイページ（育成機能は次の段階で追加）`};$('list').append(btn)}$('add').disabled=data.length>=3;$('name').disabled=data.length>=3;$('limit').textContent=data.length>=3?'上限の3人です。4人目は登録できません。':''}
$('connect').onclick=()=>{const url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key.startsWith('sb_publishable_')){status('URLとpublishable keyを確認してください。',true);return}localStorage.setItem('mirai-test-url',url);localStorage.setItem('mirai-test-key',key);init()};
$('form').onsubmit=async e=>{e.preventDefault();$('add').disabled=true;const name=$('name').value.trim();if(!name){$('add').disabled=false;return}const {error}=await client.from('test_profiles').insert({display_name:name});if(error)status('登録できません: '+error.message,true);else{$('name').value='';await refresh()}$('add').disabled=false};
$('reset').onclick=()=>{localStorage.removeItem('mirai-test-url');localStorage.removeItem('mirai-test-key');location.reload()};init();
</script></body></html>
