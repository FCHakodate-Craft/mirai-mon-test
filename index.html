<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミライモンをそだてる</title><style>
:root{font-family:system-ui,sans-serif;color:#26334b;background:#f4f8fc}*{box-sizing:border-box}body{max-width:640px;margin:0 auto;padding:18px}main{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #24304312}h1{font-size:1.55rem;margin:0 0 8px}h2{font-size:1.2rem}p{line-height:1.6}input,button{font:inherit;padding:12px;border-radius:10px}input{border:1px solid #aeb9c7;width:100%;margin:6px 0 12px}button{background:#215db4;color:#fff;border:0;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:default}.card{display:block;width:100%;text-align:left;background:#e8f1ff;color:#193b70;padding:16px;margin:8px 0}.muted{color:#596878;font-size:.9rem}.error{color:#a01829}.ok{color:#176437}section{margin-top:22px;border-top:1px solid #e0e6ee;padding-top:16px}[hidden]{display:none!important}.field{height:260px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#c9ebff 0 70%,#bde6a5 70%);display:grid;place-items:center}.field:after{content:'✿　✿　✿';position:absolute;bottom:8px;left:18px;color:#6cb36a}.monster{position:relative;width:150px;height:155px;border-radius:48% 48% 43% 43%;background:radial-gradient(circle at 38% 32%,#ffeab1,#f7b96b 75%);box-shadow:inset -12px -8px #e9926340,0 14px 25px #41644533;animation:bob 2.6s ease-in-out infinite}.monster:before,.monster:after{content:'';position:absolute;top:-14px;width:38px;height:48px;background:#f8c078;border-radius:70% 30% 30% 30%}.monster:before{left:14px;transform:rotate(-26deg)}.monster:after{right:14px;transform:rotate(26deg)}.face{position:absolute;top:65px;left:36px;font-size:34px;white-space:nowrap;color:#694954;z-index:1}@keyframes bob{50%{transform:translateY(-11px)}}.stats label{display:grid;grid-template-columns:85px 1fr 36px;gap:8px;align-items:center;margin:10px 0}.bar{height:15px;border-radius:9px;background:#e9edf3;overflow:hidden}.fill{height:100%;background:#77c5a8;transition:width .3s}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{flex:1;min-width:120px}.back{background:#e8f1ff;color:#193b70}.notice{background:#f4f8ff;border-radius:12px;padding:14px}.notice a{color:#215db4}</style></head><body><main>
<h1>ミライモンをそだてる</h1><p class="muted">１台で３人まで登録できます。きょうだいは切り替えて遊べます。</p><p id="status" role="status">接続設定を待っています。</p>
<section id="setup"><h2>初回の接続設定</h2><label>Project URL<input id="url" placeholder="https://xxxxx.supabase.co"></label><label>Publishable key<input id="key" placeholder="sb_publishable_..."></label><button id="connect">接続する</button><p class="muted">設定はこのブラウザに保存します。secret key は入力しないでください。</p></section>
<section id="app" hidden><div id="home"><h2>だれのミライモン？ <span id="count"></span></h2><div id="list"></div><form id="form"><label>あたらしくはじめる名前<input id="name" maxlength="20" required placeholder="例：はる"></label><button id="add" type="submit">ミライモンをそだてる</button></form><p id="limit" class="muted"></p></div>
<div id="care" hidden><button id="back" class="back">← ほかの人にきりかえる</button><h2 id="greeting"></h2><p id="welcome" class="muted"></p><div class="field"><div class="monster" role="img" aria-label="上下にゆれるベビーモンスター"><span class="face">•ᴗ•</span></div></div><div class="stats" id="stats"></div><p class="muted">おせわはそれぞれ１日１回。日本時間の０時にまたできます。</p><div class="actions"><button data-action="food">🍚 ごはん</button><button data-action="play">🎈 あそび</button><button data-action="exercise">🏃 うんどう</button></div><p id="care-message" role="status"></p></div>
<section><h2>みらい館からのおしらせ</h2><div id="notices" class="notice"></div></section><button id="reset" class="back" type="button">接続設定を入れ直す</button></section>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// 開催情報が決まったらここを更新する。未確定の日時は掲載しない。
const announcements=[{title:'近日開催のイベント情報は、みらい館の公式ページでご確認ください。',url:'https://hakodate-miraikan.jp/'}];
const $=id=>document.getElementById(id), status=(s,error=false)=>{$('status').textContent=s;$('status').className=error?'error':'ok'};
let client, profiles=[], current=null,busy=false;
function showNotices(){const box=$('notices');box.replaceChildren();for(const item of announcements){const p=document.createElement('p'),a=document.createElement('a');a.textContent=item.title;a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';p.append(a);box.append(p)}}
async function init(){const url=localStorage.getItem('mirai-test-url'),key=localStorage.getItem('mirai-test-key');if(!url||!key)return;$('url').value=url;$('key').value=key;try{client=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){const result=await client.auth.signInAnonymously();if(result.error)throw result.error}$('setup').hidden=true;$('app').hidden=false;await refresh()}catch(e){status('接続できません: '+e.message,true);$('setup').hidden=false;$('app').hidden=true}}
async function refresh(){const {data,error}=await client.from('test_profiles').select('id,display_name,hunger,mood,energy,created_at').order('created_at');if(error){status('データ取得に失敗: '+error.message,true);return}profiles=data;status('接続中');$('count').textContent=`${data.length}/3`;$('list').replaceChildren();for(const item of data){const btn=document.createElement('button');btn.className='card';btn.textContent=item.display_name+' のベビーモンスター';btn.onclick=()=>openProfile(item.id,false);$('list').append(btn)}$('add').disabled=data.length>=3;$('name').disabled=data.length>=3;$('limit').textContent=data.length>=3?'３人まで登録済みです。':'';if(current){const found=data.find(p=>p.id===current.id);if(found)await openProfile(found.id,false)}}
async function openProfile(id,newlyMet){current=profiles.find(p=>p.id===id);if(!current)return;$('home').hidden=true;$('care').hidden=false;$('greeting').textContent=current.display_name+' のベビーモンスター';$('welcome').textContent=newlyMet?'ベビーモンスターと出会った！ 今日からおせわをはじめよう。':'';renderStats();const {data,error}=await client.rpc('test_care_today',{p_profile_id:id});if(error){$('care-message').textContent='おせわの記録を取得できません: '+error.message;return}const done=new Set(data.map(x=>x.action));for(const b of document.querySelectorAll('[data-action]'))b.disabled=done.has(b.dataset.action);$('care-message').textContent=done.size===3?'今日のおせわはすべて完了！':''}
function renderStats(){const box=$('stats');box.replaceChildren();for(const [label,value] of [['おなか',current.hunger],['きげん',current.mood],['たいりょく',current.energy]]){const row=document.createElement('label'),name=document.createElement('span'),bar=document.createElement('div'),fill=document.createElement('div'),number=document.createElement('span');name.textContent=label;bar.className='bar';fill.className='fill';fill.style.width=value+'%';bar.append(fill);number.textContent=value;row.append(name,bar,number);box.append(row)}}
$('connect').onclick=()=>{const url=$('url').value.trim().replace(/\/+$/,''),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key.startsWith('sb_publishable_')){status('URLとpublishable keyを確認してください。',true);return}localStorage.setItem('mirai-test-url',url);localStorage.setItem('mirai-test-key',key);init()};
$('form').onsubmit=async e=>{e.preventDefault();$('add').disabled=true;const name=$('name').value.trim();if(!name){$('add').disabled=false;return}const {data,error}=await client.from('test_profiles').insert({display_name:name}).select('id').single();if(error){status('登録できません: '+error.message,true);$('add').disabled=false;return}$('name').value='';await refresh();await openProfile(data.id,true)};
$('back').onclick=()=>{$('care').hidden=true;$('home').hidden=false;current=null};
for(const b of document.querySelectorAll('[data-action]'))b.onclick=async()=>{if(busy||!current)return;busy=true;for(const x of document.querySelectorAll('[data-action]'))x.disabled=true;const action=b.dataset.action,id=current.id;const {error}=await client.rpc('care_for_test_monster',{p_profile_id:id,p_action:action});if(error){$('care-message').textContent='おせわできません: '+error.message}else{$('care-message').textContent='おせわができた！';await refresh()}if(error)await openProfile(id,false);busy=false};
$('reset').onclick=()=>{localStorage.removeItem('mirai-test-url');localStorage.removeItem('mirai-test-key');location.reload()};showNotices();init();
</script></body></html>
